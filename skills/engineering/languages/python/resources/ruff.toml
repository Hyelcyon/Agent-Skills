target-version = "py312"
line-length = 100

[lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "S",
    "T20",
    "PT",
    "RUF"
]
[lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
