title = "Gitleaks Enterprise Production Rule Config"

[extend]
useDefault = true

[[rules]]
id = "custom-internal-api-key"
description = "Internal Enterprise Service Token"
regex = '''(?i)(?:enterprise|service)[-_]?(?:key|token|secret)\s*[:=]\s*['\"][A-Za-z0-9_\-]{32,64}['\"]'''
entropy = 3.5
keywords = [
    "enterprise_key",
    "service_token",
    "enterprise_secret"
]

[[rules]]
id = "database-connection-url-secret"
description = "Database connection URI containing password"
regex = '''(?i)(?:postgres|postgresql|mysql|mongodb|redis):\/\/[a-zA-Z0-9_\-\.]+:[^@\s\/]{4,}@[a-zA-Z0-9_\-\.]+'''
keywords = [
    "postgres://",
    "postgresql://",
    "mongodb://",
    "mysql://"
]

[allowlist]
description = "Enterprise allowlist for unit test fixtures and mock stubs"
paths = [
    '''tests/.*''',
    '''mocks/.*''',
    '''testdata/.*''',
    '''fixtures/.*'''
]
regexes = [
    '''MOCK_[A-Z0-9_]+''',
    '''TEST_SECRET_[A-Z0-9_]+'''
]
