# Production Hardened Redis Configuration (Redis 7.0 - 7.4+)

bind 127.0.0.1 -::1
protected-mode yes
port 6379
# In production clusters, enable TLS on tls-port 6380 and disable plaintext port 0
# port 0
# tls-port 6380
# tls-cert-file /etc/redis/tls/redis.crt
# tls-key-file /etc/redis/tls/redis.key
# tls-ca-cert-file /etc/redis/tls/ca.crt

tcp-backlog 511
timeout 300
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""

databases 16
always-show-logo no

# Persistence: AOF every second balances throughput with <=1s durability window
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Memory Defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 30

# Slowlog: log commands taking longer than 10 milliseconds (10,000 microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 1024

# Security (Redis 7.0+ ACLs replace deprecated rename-command)
# Disable unauthenticated default user and load dedicated per-service ACLs via aclfile
user default off
# Example dedicated app role (supply password/hash via external aclfile or secret manager):
# aclfile /etc/redis/users.acl
# user app_service on >REPLACE_WITH_SECRET_AT_DEPLOY ~prod:* &prod:* +@all -@dangerous -KEYS
