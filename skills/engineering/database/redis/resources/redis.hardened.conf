# Production Hardened Redis Configuration

bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""

databases 16
always-show-logo no

# Persistence: AOF every second (balance of performance and durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Memory Defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 30

# Slowlog: log commands taking longer than 10 milliseconds (10,000 microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 1024

# Security: Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN "SHUTDOWN_ADMIN_ONLY"
