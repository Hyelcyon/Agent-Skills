version: v1
plugins:
  - plugin: buf.build/protocolbuffers/python:v28.2
    out: gen/python
  - plugin: buf.build/grpc/python:v1.66.2
    out: gen/python
  - plugin: buf.build/protocolbuffers/go:v1.34.2
    out: gen/go
    opt:
      - paths=source_relative
  - plugin: buf.build/grpc/go:v1.3.0
    out: gen/go
    opt:
      - paths=source_relative
