services:
  web:
    build:
      context: .
      dockerfile: resources/Dockerfile.multistage
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
