self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    - ubuntu-24.04
    - windows-latest
    - macos-latest
    - arc-runner-set

config-variables:
  - NODE_VERSION
  - DEPLOY_REGION
  - CLOUD_PROVIDER

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:.+'
      - 'shellcheck reported issue in this script: SC2129:.+'
