name: Sign Container Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Authenticate to GHCR and Sign Immutable Digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          IMAGE_NAME="ghcr.io/${REPOSITORY,,}"
          # Sign the immutable manifest digest rather than a mutable tag
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${REF_NAME}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
