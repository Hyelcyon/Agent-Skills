interface:
  display_name: "Release Gatekeeper"
  short_description: "Verify build artifacts and tag releases safely"
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.png"
  brand_color: "#0F766E"
  default_prompt: "Use $release-gatekeeper to run pre-release checks before tagging."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub repository and release status inspection"
